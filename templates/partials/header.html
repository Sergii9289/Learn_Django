<meta charset="UTF-8">
<title>{% block title %}Django Blog{% endblock %}</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

{% load static %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">

<!-- Навбар -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">🌐 Django Blog</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Головна</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'blog:blog_posts' %}">Блог</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'shop:home' %}">Магазин</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">Про нас</a></li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'orders:cart' %}">
                        <i class="fa-solid fa-cart-shopping"></i> Кошик
                        {% if user.is_authenticated and user.cart %}
                            <span class="badge bg-warning text-dark">
                                {{ user.cart.items.count }}
                            </span>
                        {% endif %}
                    </a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">
                            <i class="fa-solid fa-right-from-bracket"></i> Вийти
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">
                            <i class="fa-solid fa-right-to-bracket"></i> Увійти
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
